services:
  game:
    build: .
    ports:
      - "127.0.0.1:5187:5187"
    volumes:
      - dungeon-data:/app/data
    environment:
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://127.0.0.1:5187,http://localhost:5187}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    restart: unless-stopped
volumes:
  dungeon-data:
